name: Conformance Check

# Runs on every push, exactly as described in the assignment (Section 5,
# "Continuous conformance checking"): interface conformance tests plus a
# full harness pass over the public toy/dev query set, so interface
# breakage is caught within minutes of pushing, not at the deadline.
#
# This does NOT compute your leaderboard score — nDCG@10/MAP@10 here are
# against the toy set (or the released dev set, if you point CORPUS_DIR
# at data/full), not the private held-out set used for grading.

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Built before the tests so the equivalence suite actually compares the C
      # kernel against NumPy rather than skipping. Runs from inside submission/,
      # matching the grading image exactly.
      - name: Build compiled extension
        if: ${{ hashFiles('submission/setup.py') != '' }}
        working-directory: submission
        run: python setup.py build_ext --inplace

      - name: Interface conformance tests
        run: pytest tests/test_interface_conformance.py -v

      - name: Metrics unit tests
        run: pytest tests/test_metrics.py -v

      # Own correctness suite. The two steps above only check the interface and
      # the harness's own metrics -- neither would notice a broken scorer or a
      # postings codec that silently round-trips wrong. These are the tests that
      # cover the graded "correctness of required components".
      - name: Component correctness tests (codecs, BM25, Boolean/VSM)
        run: pytest tests/test_codecs.py tests/test_ranking_components.py tests/test_fast_equivalence.py tests/test_forward_index.py tests/test_rm3_strategy.py -v

      - name: Full harness smoke run (toy set)
        run: |
          python -m harness.run_harness \
            --corpus data/toy/corpus.jsonl \
            --queries data/toy/queries_dev.tsv \
            --qrels data/toy/qrels_dev.txt \
            --baseline-run data/toy/reference_bm25_run_dev.trec \
            --run-out runs/dev_run.trec \
            --report-out runs/dev_report.json

      - name: Upload run + report
        uses: actions/upload-artifact@v4
        with:
          name: dev-run-and-report
          path: runs/

  # The assignment requires `docker build` / `docker run` to succeed cleanly by
  # the conformance freeze. Verified here because Docker is not installed on the
  # development machine, so CI is the only place this can be checked at all.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the submission image
        run: docker build -t a1-submission .

      - name: Run the image's default command (harness on the toy set)
        run: docker run --rm a1-submission

      - name: Run the full test suite inside the image
        run: docker run --rm a1-submission pytest tests/ -q
